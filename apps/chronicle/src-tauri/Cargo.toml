[package]
name = "chronicle-desktop"
version = "0.1.0"
edition = "2021"  # matches Tauri templates
rust-version = "1.85"
license = "MIT OR Apache-2.0"

# Kept out of the core workspace (rust/Cargo.toml): Tauri pulls a large dependency tree.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chronicle-core = { path = "../../../rust/crates/chronicle-core" }
chronicle-db = { path = "../../../rust/crates/chronicle-db" }
chronicle-steam = { path = "../../../rust/crates/chronicle-steam" }
chronicle-bridge = { path = "../../../rust/crates/chronicle-bridge" }
chronicle-ck3 = { path = "../../../rust/crates/chronicle-ck3" }
paradox-parser = { path = "../../../rust/crates/paradox-parser" }
