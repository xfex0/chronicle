# Stellaris vocabulary used by the Modern Era Bridge.
# Display names are the in-game names. Per-entry `verified: true` = the key was seen in a real
# Stellaris 3.14.15 save (see SAVE_FORMAT.md). Requirements (authorities / requires / forbids)
# reflect the empire designer rules as known and are NOT verified by saves; the in-game
# designer is the final authority. Civic keys are `civic_<name>`; ethic keys `ethic_<name>`
# and `ethic_fanatic_<name>` (verified).

version: 1
verified: false

authorities:
  democratic: { name: "Democratic", key: auth_democratic, forbids_ethics: [authoritarian, fanatic_authoritarian], verified: true }
  oligarchic: { name: "Oligarchic", key: auth_oligarchic, forbids_ethics: [], verified: true }
  dictatorial: { name: "Dictatorial", key: auth_dictatorial, forbids_ethics: [egalitarian, fanatic_egalitarian], verified: true }
  imperial: { name: "Imperial", key: auth_imperial, forbids_ethics: [egalitarian, fanatic_egalitarian], verified: true }

ethics:
  authoritarian: { name: "Authoritarian", opposite: egalitarian, verified: true }
  egalitarian:   { name: "Egalitarian", opposite: authoritarian, verified: true }
  xenophobe:     { name: "Xenophobe", opposite: xenophile, verified: true }
  xenophile:     { name: "Xenophile", opposite: xenophobe, verified: true }
  militarist:    { name: "Militarist", opposite: pacifist, verified: true }
  pacifist:      { name: "Pacifist", opposite: militarist, verified: true }
  spiritualist:  { name: "Spiritualist", opposite: materialist, verified: true }
  materialist:   { name: "Materialist", opposite: spiritualist, verified: true }

# requires_ethics: ALL of these must be chosen (normal or fanatic)
# forbids_ethics: none of these may be chosen (normal or fanatic)
# authorities: allowed authorities (empty = any)
civics:
  technocracy:             { name: "Technocracy" }
  beacon_of_liberty:       { name: "Beacon of Liberty", authorities: [democratic], requires_ethics: [egalitarian] }
  parliamentary_system:    { name: "Parliamentary System", authorities: [democratic], verified: true }
  idealistic_foundation:   { name: "Idealistic Foundation", requires_ethics: [egalitarian], verified: true }
  distinguished_admiralty: { name: "Distinguished Admiralty" }
  nationalistic_zeal:      { name: "Nationalistic Zeal", requires_ethics: [militarist], verified: true }
  citizen_service:         { name: "Citizen Service", authorities: [democratic, oligarchic], requires_ethics: [militarist] }
  police_state:            { name: "Police State", forbids_ethics: [egalitarian], verified: true }
  imperial_cult:           { name: "Imperial Cult", authorities: [imperial], requires_ethics: [authoritarian, spiritualist] }
  exalted_priesthood:      { name: "Exalted Priesthood", authorities: [oligarchic, dictatorial], requires_ethics: [spiritualist] }
  mining_guilds:           { name: "Mining Guilds", verified: true }
  agrarian_idyll:          { name: "Agrarian Idyll", requires_ethics: [pacifist] }
  inward_perfection:       { name: "Inward Perfection", requires_ethics: [pacifist, xenophobe] }
  free_haven:              { name: "Free Haven", requires_ethics: [xenophile], dlc: true, verified: true }
  aristocratic_elite:      { name: "Aristocratic Elite", authorities: [oligarchic, imperial], forbids_ethics: [egalitarian], verified: true }
  environmentalist:        { name: "Environmentalist", verified: true }
  corvee_system:           { name: "Corvée System", forbids_ethics: [egalitarian] }
  diplomatic_corps:        { name: "Diplomatic Corps", forbids_ethics: [xenophobe] }

origins:
  prosperous_unification: { name: "Prosperous Unification", key: origin_default, verified: true }
  post_apocalyptic:       { name: "Post-Apocalyptic", key: origin_post_apocalyptic, dlc: true, verified: true }
  doomsday:               { name: "Doomsday", key: origin_doomsday, dlc: true }
  mechanists:             { name: "Mechanists", key: origin_mechanists, requires_ethics: [materialist] }
